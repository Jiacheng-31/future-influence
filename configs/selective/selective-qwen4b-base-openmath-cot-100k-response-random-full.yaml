### selective settings (removed before LLaMAFactory parses the config)
selective_training:
  enabled: true
  selection_scope: response
  ignore_zero_scores_only: true
  random_mask_zero_count: true
  random_mask_seed: 42
  score_file: data/selection-fast/OpenMathReasoning/qwen3-4b-base_cot_le16384_100k.jsonl

### model
model_name_or_path: ../model/Qwen3-4B-Base
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../Qwen/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: configs
dataset: openmath_cot_100k_le16384
template: qwen3
cutoff_len: 16384
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: outputs/selective-qwen4b-base-openmath-cot-100k-response-random-full
logging_steps: 10
save_steps: 100
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
