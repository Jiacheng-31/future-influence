### model
model_name_or_path: ../model/MiMo-7B-Base
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../Qwen/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: configs
dataset: openr1_math_100k_le16384_quality_complete
template: mimo
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: outputs/mimo7b-base-openr1-math-100k-new
logging_steps: 10
save_steps: 50
save_total_limit: 1
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
