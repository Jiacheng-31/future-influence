### model
model_name_or_path: ../model/gemma-3-12b-pt
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../Qwen/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: configs
dataset: openmath_cot_100k_le16384_quality_complete
template: gemma3
cutoff_len: 16384
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: outputs/gemma3/gemma3-12b-base-openmath-cot-100k-new
logging_steps: 10
save_strategy: "no"
save_only_model: true
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 0.1
optim: adamw_torch
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
